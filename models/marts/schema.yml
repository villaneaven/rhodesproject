version: 2

models:
  - name: fct_orders
    description: "Order level fact table."
    columns:
      - name: order_id
        tests:
          - not_null

  - name: dim_customers
    description: "Customer dimension table."
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

  - name: dim_products
    description: "Product dimension table."
    columns:
      - name: product_key
        tests:
          - not_null
          - unique

